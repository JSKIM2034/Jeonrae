<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소리 점검</title>
<style>
body { font-family: sans-serif; background: #f6efe0; color: #4a3520; padding: 18px; font-size: 17px; }
button { display: block; width: 100%; margin: 10px 0; padding: 16px; font-size: 18px; border-radius: 12px; border: 2px solid #8a6a40; background: #fff8ea; }
#log { white-space: pre-wrap; background: #fff; border-radius: 10px; padding: 12px; font-size: 14px; min-height: 120px; }
</style>
</head>
<body>
<h2>소리 점검</h2>
<p>버튼을 위에서부터 하나씩 눌러 보고, 소리가 났는지 기억해 주세요. 끝나면 이 화면을 캡처해서 보내 주세요.</p>
<button id="b1">1. 기본 삐 소리</button>
<button id="b2">2. 게임과 같은 방식 삐 소리 (44100)</button>
<button id="b3">3. 효과음 파일 재생</button>
<button id="b4">4. 효과음 파일 (웹오디오)</button>
<div id="log"></div>
<script>
var log = document.getElementById('log');
function out(t) { log.textContent += t + '\n'; }
out('브라우저: ' + navigator.userAgent);
out('보안 연결: ' + window.isSecureContext + ' / crossOriginIsolated: ' + window.crossOriginIsolated);
var AC = window.AudioContext || window.webkitAudioContext;
out('AudioContext 있음: ' + !!AC);
function beep(ctx, label) {
	var go = function () {
		var o = ctx.createOscillator(), g = ctx.createGain();
		o.frequency.value = 660; g.gain.value = 0.3;
		o.connect(g); g.connect(ctx.destination);
		o.start(); o.stop(ctx.currentTime + 0.4);
		out(label + ' → 상태 ' + ctx.state + ', 샘플레이트 ' + ctx.sampleRate + ', 워크렛 ' + !!ctx.audioWorklet);
	};
	if (ctx.state !== 'running') { ctx.resume().then(go, function (e) { out(label + ' resume 실패: ' + e); go(); }); } else { go(); }
}
var c1 = null, c2 = null;
document.getElementById('b1').onclick = function () {
	try { c1 = c1 || new AC(); beep(c1, '1번'); } catch (e) { out('1번 오류: ' + e); }
};
document.getElementById('b2').onclick = function () {
	try { c2 = c2 || new AC({ sampleRate: 44100 }); beep(c2, '2번'); } catch (e) { out('2번 오류: ' + e); }
	if (c2 && c2.audioWorklet) {
		c2.audioWorklet.addModule('index.audio.position.worklet.js').then(function () { out('2번 워크렛 불러오기 성공'); }, function (e) { out('2번 워크렛 실패: ' + e); });
	}
};
document.getElementById('b3').onclick = function () {
	var a = new Audio('source/sounds/coin.wav');
	a.play().then(function () { out('3번 재생 시작'); }, function (e) { out('3번 실패: ' + e); });
};
document.getElementById('b4').onclick = function () {
	try {
		c2 = c2 || new AC({ sampleRate: 44100 });
		fetch('source/sounds/coin.wav').then(function (r) { return r.arrayBuffer(); }).then(function (b) {
			return new Promise(function (ok, no) { c2.decodeAudioData(b, ok, no); });
		}).then(function (buf) {
			c2.resume();
			var s = c2.createBufferSource(); s.buffer = buf; s.connect(c2.destination); s.start();
			out('4번 재생 → 상태 ' + c2.state);
		}).catch(function (e) { out('4번 실패: ' + e); });
	} catch (e) { out('4번 오류: ' + e); }
};
</script>
</body>
</html>
